<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">QUBI-47 autonomous quantum companion habitat</title>
  <desc id="desc">A living qubit robot roams between a code console, quantum orb, bug zone, and charging dock while expressing curiosity, confusion, annoyance, anger, sadness, joy, and sleepiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse"><stop stop-color="#03070E"/><stop offset=".58" stop-color="#07131F"/><stop offset="1" stop-color="#0A1D31"/></linearGradient>
    <radialGradient id="botCore" cx="50%" cy="40%" r="65%"><stop stop-color="#CFFAFE"/><stop offset=".3" stop-color="#22D3EE"/><stop offset="1" stop-color="#2563EB"/></radialGradient>
    <radialGradient id="orb" cx="45%" cy="40%" r="60%"><stop stop-color="#DDD6FE" stop-opacity=".7"/><stop offset=".35" stop-color="#8B5CF6" stop-opacity=".35"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="floor" x1="32" x2="1168" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE" stop-opacity="0"/><stop offset=".2" stop-color="#22D3EE"/><stop offset=".7" stop-color="#8B5CF6"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
