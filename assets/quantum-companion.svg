    <text x="62" y="23" fill="#E2E8F0" font-size="11" font-weight="700" letter-spacing="1.2">QUBI-47 // AUTONOMOUS COMPANION HABITAT</text>
    <text x="432" y="23" fill="#64748B" font-size="10">$ agent.mood →</text>
    <g font-size="10.5" font-weight="700" letter-spacing=".8">
      <text x="535" y="23" class="phase p1" fill="#94A3B8">IDLE</text><text x="535" y="23" class="phase p2" fill="#C4B5FD">CURIOUS</text><text x="535" y="23" class="phase p3" fill="#67E8F9">SCANNING</text><text x="535" y="23" class="phase p4" fill="#C4B5FD">ENTANGLING</text><text x="535" y="23" class="phase p5" fill="#67E8F9">COMPUTING</text><text x="535" y="23" class="phase p6" fill="#C4B5FD">THINKING</text><text x="535" y="23" class="phase p7" fill="#67E8F9">WRITING_CODE</text><text x="535" y="23" class="phase p8" fill="#22D3EE">CLICKING_BUTTONS</text><text x="535" y="23" class="phase p9" fill="#34D399">COMPILING</text><text x="535" y="23" class="phase p10" fill="#FBBF24">CONFUSED</text><text x="535" y="23" class="phase p11" fill="#22D3EE">DEBUGGING</text><text x="535" y="23" class="phase p12" fill="#F59E0B">ANNOYED</text><text x="535" y="23" class="phase p13" fill="#FB7185">ANGRY_AT_BUG</text><text x="535" y="23" class="phase p14" fill="#60A5FA">SAD_AFTER_ERROR</text><text x="535" y="23" class="phase p15" fill="#67E8F9">SELF_REPAIR</text><text x="535" y="23" class="phase p16" fill="#A78BFA">SUPERPOSITION</text><text x="535" y="23" class="phase p17" fill="#C4B5FD">TELEPORTING</text><text x="535" y="23" class="phase p18" fill="#FBBF24">CELEBRATING</text><text x="535" y="23" class="phase p19" fill="#34D399">READY</text><text x="535" y="23" class="phase p20" fill="#94A3B8">SLEEP_MODE</text>
