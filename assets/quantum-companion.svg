    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace}
      .phase{opacity:0;animation:phaseShow 80s steps(1,end) infinite}.p2{animation-delay:4s}.p3{animation-delay:8s}.p4{animation-delay:12s}.p5{animation-delay:16s}.p6{animation-delay:20s}.p7{animation-delay:24s}.p8{animation-delay:28s}.p9{animation-delay:32s}.p10{animation-delay:36s}.p11{animation-delay:40s}.p12{animation-delay:44s}.p13{animation-delay:48s}.p14{animation-delay:52s}.p15{animation-delay:56s}.p16{animation-delay:60s}.p17{animation-delay:64s}.p18{animation-delay:68s}.p19{animation-delay:72s}.p20{animation-delay:76s}
      @keyframes phaseShow{0%,4.94%{opacity:1}5%,100%{opacity:0}}
      .float{animation:float 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes float{0%,100%{transform:translateY(-2px) rotate(-.4deg)}50%{transform:translateY(3px) rotate(.4deg)}}
      .cursor{filter:drop-shadow(0 0 3px #22D3EE)}
