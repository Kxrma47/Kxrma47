<svg width="1200" height="210" viewBox="0 0 1200 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Open collaboration quantum terminal</title><desc id="desc">A terminal inviting research and software engineering collaboration beside an animated Bloch sphere.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1200" y2="210" gradientUnits="userSpaceOnUse"><stop stop-color="#03070E"/><stop offset=".62" stop-color="#07131F"/><stop offset="1" stop-color="#0B2037"/></linearGradient><radialGradient id="a" cx="0" cy="0" r="1" gradientTransform="translate(1000 110) rotate(90) scale(130 190)" gradientUnits="userSpaceOnUse"><stop stop-color="#22D3EE" stop-opacity=".13"/><stop offset="1" stop-color="#03070E" stop-opacity="0"/></radialGradient><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" stroke="#67E8F9" stroke-opacity=".025"/></pattern><filter id="g" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#A5F3FC"/></marker></defs>
  <rect x="1" y="1" width="1198" height="208" rx="14" fill="url(#bg)" stroke="#22D3EE" stroke-opacity=".2"/><rect x="1" y="1" width="1198" height="208" rx="14" fill="url(#a)"/><rect x="1" y="1" width="1198" height="208" rx="14" fill="url(#grid)"/>
  <path d="M1 35H1199" stroke="#22D3EE" stroke-opacity=".12"/><circle cx="20" cy="18" r="3.5" fill="#8B5CF6"/><circle cx="33" cy="18" r="3.5" fill="#22D3EE"/><circle cx="46" cy="18" r="3.5" fill="#34D399"/><text x="62" y="22" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" fill="#64748B" font-size="10" letter-spacing="1">QNODE://COLLABORATION_CHANNEL</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace"><text x="48" y="70" fill="#64748B" font-size="12"><tspan fill="#22D3EE">kxrma47@qnode</tspan><tspan fill="#475569">:</tspan><tspan fill="#8B5CF6">~</tspan><tspan fill="#94A3B8">$ open_channel --research --engineering</tspan></text><text x="48" y="112" fill="#34D399" font-size="23" font-weight="700" letter-spacing="2">CHANNEL::OPEN</text><rect x="266" y="89" width="4" height="29" rx="2" fill="#22D3EE"><animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/></rect><text x="49" y="139" fill="#E2E8F0" font-size="13.5" letter-spacing=".5">research collaboration / software engineering</text><text x="49" y="164" fill="#64748B" font-size="10.5">PROTOCOLS :: HSE_PROFILE · ORCID · OPEN_SOURCE · REPRODUCIBLE_RESEARCH</text><text x="49" y="187" fill="#475569" font-size="9.5">handshake pending — interesting problems welcome</text></g>
  <path d="M765 53V181" stroke="#22D3EE" stroke-opacity=".12"/><path d="M765 53H779M765 181H779" stroke="#22D3EE" stroke-opacity=".34"/>
  <g transform="translate(998 118)"><circle r="66" fill="#07131F" fill-opacity=".62" stroke="#22D3EE" stroke-opacity=".45"/><ellipse rx="66" ry="21" fill="none" stroke="#22D3EE" stroke-opacity=".7"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/></ellipse><ellipse rx="66" ry="21" transform="rotate(60)" fill="none" stroke="#8B5CF6" stroke-opacity=".65"><animateTransform attributeName="transform" type="rotate" from="60" to="420" dur="12s" repeatCount="indefinite"/></ellipse><ellipse rx="21" ry="66" fill="none" stroke="#475569" stroke-opacity=".65"/><path d="M-76 0H76M0-76V76" stroke="#334155" stroke-opacity=".7"/><path d="M0 0L39 -46" stroke="#A5F3FC" stroke-width="2" marker-end="url(#arrow)" filter="url(#g)"><animate attributeName="d" values="M0 0L39 -46;M0 0L54 -28;M0 0L39 -46" dur="5s" repeatCount="indefinite"/></path><circle r="5" fill="#22D3EE" filter="url(#g)"/><circle cx="39" cy="-46" r="4" fill="#C4B5FD" filter="url(#g)"><animate attributeName="cx" values="39;54;39" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="-46;-28;-46" dur="5s" repeatCount="indefinite"/></circle></g>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace"><text x="846" y="53" fill="#64748B" font-size="9.5" letter-spacing="1">BLOCH_SPHERE // |ψ⟩</text><text x="1085" y="190" fill="#67E8F9" font-size="10">COHERENT</text></g>
</svg>
