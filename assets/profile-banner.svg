<svg width="1200" height="270" viewBox="0 0 1200 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kxrma47 quantum engineering terminal</title>
  <desc id="desc">A secure research terminal running an animated two-qubit Bell-state circuit.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#03060D"/>
      <stop offset="0.55" stop-color="#07131E"/>
      <stop offset="1" stop-color="#0B1E35"/>
    </linearGradient>
    <radialGradient id="qpuAura" cx="0" cy="0" r="1" gradientTransform="translate(970 135) rotate(180) scale(360 250)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="0.58" stop-color="#8B5CF6" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#03060D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="170" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trace" x1="48" y1="0" x2="654" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.72" stop-color="#8B5CF6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#A5F3FC" stroke-opacity="0.035"/>
      <circle cx="1" cy="1" r="0.8" fill="#67E8F9" fill-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="270" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <rect width="1200" height="270" fill="url(#qpuAura)"/>
    <rect width="1200" height="270" fill="url(#grid)"/>
    <rect x="-170" width="170" height="270" fill="url(#scan)">
      <animate attributeName="x" values="-170;1200" dur="8s" repeatCount="indefinite"/>
    </rect>

    <g fill="#22D3EE" fill-opacity="0.055" font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace" font-size="9" letter-spacing="2">
      <text x="676" y="70">01101001 11001010 00101101 10100110</text>
      <text x="704" y="248">0x7E3A  ::  ψ[00] + ψ[11]  ::  0xC1</text>
    </g>
  </g>

  <rect x="0" y="0" width="1200" height="34" rx="16" fill="#050A12"/>
  <path d="M0 34H1200" stroke="#22D3EE" stroke-opacity="0.13"/>
  <circle cx="21" cy="17" r="4" fill="#F43F5E" fill-opacity="0.75"/>
  <circle cx="36" cy="17" r="4" fill="#F59E0B" fill-opacity="0.75"/>
  <circle cx="51" cy="17" r="4" fill="#22C55E" fill-opacity="0.75"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="70" y="21" fill="#64748B" font-size="10.5" letter-spacing="0.8">ssh://qnode.local/session/KXRMA47</text>
    <circle cx="1091" cy="17" r="3" fill="#34D399" filter="url(#glow)">
      <animate attributeName="opacity" values="0.45;1;0.45" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="1102" y="21" fill="#6EE7B7" font-size="10" letter-spacing="1">LINK_SECURE</text>

    <text x="48" y="64" fill="#64748B" font-size="12.5" letter-spacing="0.35">
      <tspan fill="#22D3EE">kxrma47@qnode</tspan><tspan fill="#475569">:</tspan><tspan fill="#8B5CF6">~</tspan><tspan fill="#94A3B8">$ exec ./profile --state=active</tspan>
    </text>

    <text x="48" y="124" fill="#F8FAFC" font-size="49" font-weight="700" letter-spacing="4">KXRMA47</text>
    <text x="50" y="124" fill="#22D3EE" font-size="49" font-weight="700" letter-spacing="4" opacity="0">KXRMA47
      <animate attributeName="opacity" values="0;0;0.22;0;0;0.12;0" keyTimes="0;0.47;0.485;0.50;0.78;0.79;1" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x" values="50;50;53;48;50" keyTimes="0;0.47;0.485;0.50;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <rect x="303" y="86" width="4" height="43" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>

    <text x="50" y="153" fill="#67E8F9" font-size="15.5" font-weight="600" letter-spacing="2">SOFTWARE ENGINEER // QUANTUM &amp; ML RESEARCH</text>
    <rect x="48" y="168" width="585" height="1.5" fill="url(#trace)"/>

    <text x="49" y="194" fill="#64748B" font-size="11" letter-spacing="0.7">[01]</text>
    <text x="82" y="194" fill="#94A3B8" font-size="11.5">research_kernel</text>
    <text x="214" y="194" fill="#34D399" font-size="11.5">:: ONLINE</text>
    <text x="340" y="194" fill="#64748B" font-size="11" letter-spacing="0.7">[02]</text>
    <text x="373" y="194" fill="#94A3B8" font-size="11.5">qpu_runtime</text>
    <text x="472" y="194" fill="#C4B5FD" font-size="11.5">:: ENTANGLED</text>

    <text x="49" y="217" fill="#64748B" font-size="11" letter-spacing="0.7">[03]</text>
    <text x="82" y="217" fill="#94A3B8" font-size="11.5">ml_pipeline</text>
    <text x="187" y="217" fill="#34D399" font-size="11.5">:: READY</text>
    <text x="294" y="217" fill="#64748B" font-size="11" letter-spacing="0.7">[04]</text>
    <text x="327" y="217" fill="#94A3B8" font-size="11.5">systems</text>
    <text x="396" y="217" fill="#34D399" font-size="11.5">:: TESTED</text>

    <text x="49" y="246" fill="#64748B" font-size="10.5" letter-spacing="0.4">FOCUS:// QUANTUM × MACHINE_LEARNING × RESEARCH_SYSTEMS</text>
  </g>

  <path d="M672 48V251" stroke="#22D3EE" stroke-opacity="0.12"/>
  <path d="M672 48H685M672 251H685" stroke="#22D3EE" stroke-opacity="0.34"/>

  <g font-family="ui-monospace,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="710" y="58" fill="#64748B" font-size="10" letter-spacing="1.6">QPU://BELL_STATE.CIRCUIT</text>
    <text x="1087" y="58" fill="#8B5CF6" font-size="10" letter-spacing="1">ψ :: LIVE</text>

    <text x="710" y="111" fill="#94A3B8" font-size="12">q[0] |0⟩</text>
    <text x="710" y="174" fill="#94A3B8" font-size="12">q[1] |0⟩</text>
    <path d="M778 106H1145M778 169H1145" stroke="#475569" stroke-width="1.4"/>

    <rect x="826" y="85" width="42" height="42" rx="4" fill="#0A1020" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <text x="847" y="112" fill="#DDD6FE" font-size="17" font-weight="700" text-anchor="middle">H</text>

    <path d="M939 106V169" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.7"/>
    <circle cx="939" cy="106" r="5.5" fill="#22D3EE" filter="url(#glow)"/>
    <circle cx="939" cy="169" r="15" fill="#07131E" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M930 169H948M939 160V178" stroke="#C4B5FD" stroke-width="2"/>

    <g stroke="#22D3EE" stroke-width="1.5" fill="#07111C">
      <rect x="1034" y="85" width="46" height="42" rx="5"/>
      <rect x="1034" y="148" width="46" height="42" rx="5"/>
    </g>
    <g stroke="#67E8F9" stroke-width="1.4" fill="none">
      <path d="M1044 116A13 13 0 0 1 1070 116M1057 116L1067 102"/>
      <path d="M1044 179A13 13 0 0 1 1070 179M1057 179L1067 165"/>
    </g>
    <text x="1091" y="111" fill="#64748B" font-size="10">M → c0</text>
    <text x="1091" y="174" fill="#64748B" font-size="10">M → c1</text>

    <circle cx="780" cy="106" r="4" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="cx" values="780;847;939;1057" keyTimes="0;0.32;0.64;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.90;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="939" cy="169" r="4" fill="#8B5CF6" filter="url(#glow)">
      <animate attributeName="cx" values="939;939;1057" keyTimes="0;0.48;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.45;0.63;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <text x="710" y="218" fill="#64748B" font-size="10.5">RESULT_STATE</text>
    <text x="800" y="218" fill="#A5F3FC" font-size="12.5">|Φ+⟩ = (|00⟩ + |11⟩) / √2</text>
    <text x="710" y="239" fill="#64748B" font-size="10.5">MEASURE</text>
    <text x="800" y="239" fill="#34D399" font-size="10.5">{ 00: 50.0%  |  11: 50.0% }</text>
  </g>

  <path d="M1 16Q1 1 16 1H1184Q1199 1 1199 16V254Q1199 269 1184 269H16Q1 269 1 254Z" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="2"/>
</svg>
