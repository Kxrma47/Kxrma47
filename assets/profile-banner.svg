<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Kxrma47 - Quantum Software Engineer Terminal</title>
  <desc id="desc">An animated research terminal with a two-qubit Bell-state circuit.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050914"/>
      <stop offset="0.62" stop-color="#081824"/>
      <stop offset="1" stop-color="#10233A"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="160" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="terminalLine" x1="58" y1="0" x2="670" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.3"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" stroke="#A5F3FC" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="240" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="240" rx="18" fill="url(#grid)"/>
  <rect x="-160" width="160" height="240" fill="url(#scan)">
    <animate attributeName="x" values="-160;1200" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g font-family="JetBrains Mono,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="58" y="45" fill="#64748B" font-size="14" letter-spacing="0.5">root@qnode:~$ ./profile --mode=research</text>
    <text x="58" y="106" fill="#F8FAFC" font-size="51" font-weight="700" letter-spacing="4">KXRMA47</text>
    <rect x="314" y="69" width="5" height="45" rx="2" fill="#22D3EE">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.05s" repeatCount="indefinite"/>
    </rect>
    <text x="60" y="140" fill="#67E8F9" font-size="17" font-weight="600" letter-spacing="1.5">QUANTUM SOFTWARE ENGINEER</text>
    <rect x="60" y="157" width="552" height="1.5" fill="url(#terminalLine)"/>
    <text x="60" y="184" fill="#94A3B8" font-size="12.5" letter-spacing="0.35">runtime  research engineering // ML // full-stack // data</text>
    <text x="60" y="207" fill="#94A3B8" font-size="12.5" letter-spacing="0.35">status   building tested, reproducible systems</text>
  </g>

  <g font-family="JetBrains Mono,SFMono-Regular,Consolas,Liberation Mono,monospace">
    <text x="720" y="38" fill="#64748B" font-size="11" letter-spacing="1.5">BELL STATE // CIRCUIT_01</text>

    <text x="720" y="86" fill="#94A3B8" font-size="13">q0 |0⟩</text>
    <text x="720" y="156" fill="#94A3B8" font-size="13">q1 |0⟩</text>
    <path d="M782 81H1135M782 151H1135" stroke="#475569" stroke-width="1.5"/>

    <rect x="838" y="59" width="44" height="44" rx="5" fill="#0F172A" stroke="#8B5CF6" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="4.8s" repeatCount="indefinite"/>
    </rect>
    <text x="860" y="87" fill="#DDD6FE" font-size="18" font-weight="700" text-anchor="middle">H</text>

    <path d="M956 81V151" stroke="#22D3EE" stroke-width="2" stroke-opacity="0.65"/>
    <circle cx="956" cy="81" r="6" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="956" cy="151" r="16" fill="#081824" stroke="#8B5CF6" stroke-width="2"/>
    <path d="M946 151H966M956 141V161" stroke="#C4B5FD" stroke-width="2"/>

    <g stroke="#22D3EE" stroke-width="1.5" fill="#0B1220">
      <rect x="1052" y="59" width="48" height="44" rx="6"/>
      <rect x="1052" y="129" width="48" height="44" rx="6"/>
    </g>
    <g stroke="#67E8F9" stroke-width="1.5" fill="none">
      <path d="M1062 89A14 14 0 0 1 1090 89"/>
      <path d="M1076 89L1086 75"/>
      <path d="M1062 159A14 14 0 0 1 1090 159"/>
      <path d="M1076 159L1086 145"/>
    </g>
    <text x="1110" y="86" fill="#64748B" font-size="11">M</text>
    <text x="1110" y="156" fill="#64748B" font-size="11">M</text>

    <circle cx="784" cy="81" r="4" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="cx" values="784;860;956;1076" keyTimes="0;0.32;0.64;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="956" cy="151" r="4" fill="#8B5CF6" filter="url(#glow)">
      <animate attributeName="cx" values="956;956;1076" keyTimes="0;0.48;1" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.45;0.62;1" dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <text x="922" y="211" fill="#A5F3FC" font-size="13" text-anchor="middle">|Φ+⟩ = (|00⟩ + |11⟩) / √2</text>
  </g>

  <rect x="1" y="1" width="1198" height="238" rx="17" stroke="#22D3EE" stroke-opacity="0.16" stroke-width="2"/>
</svg>
